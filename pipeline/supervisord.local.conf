; Process set for running the app on its own (CATALOG_BACKEND=local):
; the API with the built-in catalogue, the website, and a loader that fills
; and refreshes the catalogue. No CKAN and no Prefect server.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:fastapi]
command=uvicorn pipeline.api:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nextjs]
command=node server.js
directory=/app
environment=HOSTNAME="0.0.0.0",PORT="3000"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:loader]
; Runs the pipeline steps directly; no Prefect server is involved.
command=python -m pipeline.bootstrap
directory=/app
autostart=true
autorestart=unexpected
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
