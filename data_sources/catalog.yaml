    publisher: Armed Conflict Location and Event Data
    url: https://acleddata.com/
    coverage: Dated, located records of political violence and protest.
    topics: [security]
    geography: point
    access: restricted
    integration: excluded
    licence: registration and terms restrict redistribution
    checked: ""
    notes: Cannot be republished as open data. Link to it if security data is requested.
