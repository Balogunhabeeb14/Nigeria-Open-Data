name: Pipeline tests

on:
  push:
    paths: ['pipeline/**', 'data_sources/**', 'pyproject.toml', '.github/workflows/tests.yml']
  pull_request:
    paths: ['pipeline/**', 'data_sources/**', 'pyproject.toml', '.github/workflows/tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pipeline_db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: portal_test
        ports:
          - 55434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pipeline/requirements.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt pytest "setuptools<81"   # ckanapi 4.7 imports pkg_resources
      - name: Run tests
        env:
          NOD_TEST_DATABASE_URL: postgresql://pipeline:pipeline@localhost:55434/portal_test
        # No network access is needed: sources and CKAN are faked.
        run: python -m pytest pipeline/tests -q
